<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasteland · Edición de cumpleaños</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030b1f;--b1:#0a2a6b;--b2:#1e6bff;--b3:#7ec8ff;--ink:#e8f1ff;--mut:#8fa6d1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% 0%,#0b2f7a 0%,var(--bg) 60%) fixed}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 60px;text-align:center}
.eyebrow{letter-spacing:.35em;font-size:.72rem;color:var(--b3);text-transform:uppercase}
h1{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(2rem,8vw,3.6rem);margin:.3em 0 .1em;background:linear-gradient(90deg,#fff,var(--b3),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 22px;font-size:.95rem}
.deck{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:0 auto 20px}
.glow{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(30,107,255,.45),transparent 65%);opacity:.35;transition:opacity .6s}
.deck.play .glow{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.record{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,.14),transparent 20%,rgba(126,200,255,.18) 45%,transparent 65%,rgba(255,255,255,.12)),repeating-radial-gradient(circle,#0a1330 0 2px,#050a1a 3px 4px);box-shadow:0 20px 60px rgba(0,20,90,.8),inset 0 0 0 3px #0d1c46;animation:spin 3.2s linear infinite;animation-play-state:paused}
.deck.play .record{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--b3),var(--b2) 55%,var(--b1));display:grid;place-items:center;font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;line-height:1.3;padding:6px}
.label::after{content:"";position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:var(--bg)}
.label span{position:relative;top:-14%}
.tracks{display:grid;gap:8px;margin:0 auto 18px;max-width:460px;padding:0;list-style:none}
.tracks button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px solid rgba(126,200,255,.18);background:rgba(10,42,107,.35);color:var(--ink);font:inherit;cursor:pointer;text-align:left;backdrop-filter:blur(6px);transition:.25s}
.tracks button:hover{border-color:var(--b3);transform:translateX(4px)}
.tracks button.on{background:linear-gradient(90deg,var(--b2),#0f46c4);border-color:var(--b3);box-shadow:0 0 22px rgba(30,107,255,.6)}
.tracks .n{color:var(--b3);font-weight:700;width:1.4em}
.tracks .t{flex:1;font-weight:600}
.tracks .ok{opacity:0;transition:.3s}
.tracks button.done .ok{opacity:1}
.msg{min-height:150px;max-width:520px;margin:0 auto 14px;padding:20px 22px;border-radius:18px;background:rgba(3,11,31,.6);border:1px solid rgba(126,200,255,.2);line-height:1.6;font-size:1.02rem;text-align:left}
.msg small{display:block;color:var(--b3);letter-spacing:.2em;text-transform:uppercase;font-size:.68rem;margin-bottom:8px}
.msg a{color:var(--b3);font-size:.8rem}
.prog{color:var(--mut);font-size:.85rem;margin-bottom:14px}
.verso{display:none;margin:0 0 14px;padding-left:12px;border-left:3px solid var(--b2);font-family:'Playfair Display',serif;font-style:italic;font-size:1.1rem;color:#fff;white-space:pre-line}
.verso:not(:empty){display:block}
.tracks button:disabled{opacity:.5;cursor:not-allowed}
.tracks button.lock:hover{transform:none;border-color:rgba(126,200,255,.18)}
.tracks button.lock .ok{opacity:.85}
.verso .vm{font-size:1.1rem}
.verso .vx{font-family:'Space Grotesk',system-ui,sans-serif;font-style:normal;font-size:.85rem;color:var(--mut);margin-top:4px}
.verso .vx b{color:var(--b3);font-size:.68rem;letter-spacing:.15em;margin-right:8px}
.tr{margin-top:10px;font-size:.88rem;color:var(--mut)}
.tr b{color:var(--b3);margin-right:8px;font-size:.7rem;letter-spacing:.15em}
#player{max-width:520px;margin:0 auto 16px}
#player iframe{border:0;border-radius:14px;color-scheme:normal}
#player .hint{margin-top:8px;font-size:.8rem;color:var(--mut)}
#player .hint a{color:var(--b3)}
.cta{display:none;padding:14px 26px;border-radius:999px;border:0;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--b2),var(--b3));box-shadow:0 0 30px rgba(30,107,255,.7);animation:pulse 1.6s infinite}
.cta.show{display:inline-block}
#fin{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(3,11,31,.94);padding:20px}
#fin.show{display:grid}
.cake{position:relative;width:200px;height:140px;margin:60px auto 24px}
.cake i{position:absolute;left:0;right:0;border-radius:12px}
.cake .a{bottom:0;height:60px;background:linear-gradient(#1e6bff,#0a2a6b)}
.cake .b{bottom:60px;left:25px;right:25px;height:46px;background:linear-gradient(#7ec8ff,#1e6bff)}
.candle{position:absolute;bottom:106px;left:calc(50% - 5px);width:10px;height:38px;border-radius:3px;background:#e8f1ff}
.flame{position:absolute;bottom:142px;left:calc(50% - 11px);width:22px;height:34px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 70%,#fff,var(--b3) 45%,var(--b2));box-shadow:0 0 30px 10px rgba(126,200,255,.7);cursor:pointer;animation:fl .18s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes fl{to{transform:scale(1.08,.94) rotate(3deg)}}
.flame.off{animation:none;opacity:0;transform:scale(.2);transition:.5s}
#fin h2{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.8rem,7vw,3rem);margin:0 0 8px}
#fin p{color:var(--mut);max-width:420px;margin:0 auto 16px}
#fin .big{opacity:0;transition:opacity 1s;color:var(--ink)}
#fin.won .big{opacity:1}
</style>
</head>
<body>
<canvas id="stars"></canvas><canvas id="fx"></canvas>
<main>
  <div class="eyebrow">Edición especial · Brent Faiyaz</div>
  <h1 id="ttl">Feliz cumpleaños amor</h1>
  <p class="sub">Escucha las pistas en orden, de la 1 a la 6. Al terminar podrás elegir cualquiera y habrá una sorpresa al final muak</p>

  <div class="deck" id="deck"><div class="glow"></div><div class="record"><div class="label"><span id="lbl">Para ti</span></div></div></div>

  <ul class="tracks" id="tracks"></ul>
  <div class="msg" id="msg"><small>Lado A</small><div class="verso" id="verso"></div><span id="txt">Elige una pista para empezar…</span></div>
  <div id="player"></div>
  <div class="prog" id="prog"></div>
  <button class="cta" id="cta">🕯️ Pedir un deseo</button>
</main>

<div id="fin">
  <div>
    <div class="cake"><i class="a"></i><i class="b"></i><div class="candle"></div><div class="flame" id="flame" title="Sopla"></div></div>
    <h2 id="finT">Toca la llama y pide un deseo</h2>
    <p class="big" id="finP"></p>
  </div>
</div>

<script>
const NOMBRE = "Stephany";
const FIRMA  = "Con todo mi cariño y claro amor, - Franko";
const PISTAS = [
  {t:"BEST TIME", id:"1zgHn1EqUyA0HqNYMdJ5ia",
   es:"¿Dime a dónde vas? Nadie irá si no estamos allí",
   en:"Say you going where? Ain't nobody going if we ain't gon' be there",
   it:"Dite che state andando dove? Non ci va nessuno se non ci siamo anche noi",
   verso:{es:"", en:"", it:""}},
  {t:"GRAVITY", id:"3zakx7RAwdkUQlOoQ7SJRt",
   es:"No significan mucho para mí. Porque sé que tengo una panadería en casa...",
   en:"They don't mean much to me. 'Cause I know that I have a bakery back at home...",
   it:"Non significano molto per me. Perché so di avere un panificio a casa...",
   verso:{es:"", en:"", it:""}},
  {t:"WASTING TIME", id:"6N9U1wkWniSXD4TKD4ln0h",
   es:"Compartiré mi mundo contigo. Si vas a perder tu tiempo (sí, sí, sí), entonces pierde tu tiempo conmigo",
   en:"I'll share my world with you. If you're gonna waste your time (yeah, yeah, yeah), then waste your time with me",
   it:"Condividerò il mio mondo con te. Se hai intenzione di perdere il tuo tempo (sì, sì, sì), allora perdi il tuo tempo con me",
   verso:{es:"", en:"", it:""}},
  {t:"BUTTERFLIES", id:"4jyyma8YdFC4S4llusSFRu",
   es:"Deseo que pudiéramos hacer esto juntos (solo tú y yo), ¿Cómo te sientes?. ¿Es algo como lo que yo siento? (¿sí o no?)",
   en:"I wish we could do this together (it's only you and me), How do you feel?. Is it anything like I feel? (Yes or no?)",
   it:"Vorrei che potessimo fare questo insieme (solo io e te), come ti senti? È qualcosa di simile a quello che provo io? (sì o no?)",
   verso:{es:"", en:"", it:""}},
  {t:"FOREVER YOURS", id:"2JqkpMe2eJToJNHEqkJeCu",
   es:"Y no te defraudaré (juro que no te defraudaré, no), tienes mi palabra. Por siempre tuyo, por siempre tuyo",
   en:"And I won't let you down (I swear I won't let you down, down), you have my word. Forever yours, forever yours",
   it:"E non ti deluderò (lo giuro che non ti deluderò), hai la mia parola. Per sempre tuo, per sempre tuo",
   verso:{es:"", en:"", it:""}},
  {t:"BELONG TO YOU", id:"4qulzmZFfKLVcfpGXXCP9H",
   es:"Te doy todo mi amor, (cada vez que veo tu rostro me dan ganas de cantar). Y cada vez que pienso en tu amor, me vuelve loco",
   en:"Give you all my love, (everytime I see your face it makes me wanna sing). And everytime I think about your love, It drives me crazy",
   it:"Ti do tutto il mio amore, (ogni volta che vedo il tuo viso mi fa venire voglia di cantare). E ogni volta che penso al tuo amore, mi fa impazzire",
   verso:{es:"", en:"", it:""}}
];

const $=s=>document.querySelector(s);
const tracks=$('#tracks'),txt=$('#txt'),deck=$('#deck'),cta=$('#cta');
const done=new Set();let timer;
$('#ttl').textContent='Feliz cumpleaños, '+NOMBRE;
$('#lbl').innerHTML='Para<br>'+NOMBRE;
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

PISTAS.forEach((p,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.innerHTML='<span class="n">'+(i+1)+'</span><span class="t">'+esc(p.t)+'</span><span class="ok"></span>';
  b.onclick=()=>play(i,b);li.appendChild(b);tracks.appendChild(li);
});
const allDone=()=>done.size===PISTAS.length;
const canPlay=i=>allDone()||i===0||done.has(i-1);
function refreshLocks(){
  document.querySelectorAll('.tracks button').forEach((b,i)=>{
    const ok=canPlay(i);b.disabled=!ok;b.classList.toggle('lock',!ok);
    b.querySelector('.ok').textContent=done.has(i)?'✦':(ok?'':'🔒');
  });
}
function setVerso(v){
  const box=$('#verso');box.textContent='';v=v||{};
  [['es',''],['en','EN'],['it','IT']].forEach(([l,tag])=>{
    if(!v[l])return;
    const d=document.createElement('div');d.className=l==='es'?'vm':'vx';
    if(tag){const g=document.createElement('b');g.textContent=tag;d.appendChild(g);}
    d.appendChild(document.createTextNode(v[l]));box.appendChild(d);
  });
}
function play(i,b){
  if(!canPlay(i))return;
  document.querySelectorAll('.tracks button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');deck.classList.add('play');
  clearInterval(timer);
  const p=PISTAS[i];let k=0;
  $('#msg').firstElementChild.textContent='Pista '+(i+1)+' · '+p.t;
  txt.innerHTML='';setVerso(p.verso);
  timer=setInterval(()=>{
    txt.textContent=p.es.slice(0,++k);
    if(k>=p.es.length){
      clearInterval(timer);
      txt.insertAdjacentHTML('beforeend','<div class="tr"><b>EN</b>'+esc(p.en)+'</div><div class="tr"><b>IT</b>'+esc(p.it)+'</div>');
      done.add(i);b.classList.add('done');refreshLocks();updateProg();
    }
  },28);
  burst(innerWidth/2,innerHeight*.35,18);
  loadPlayer(p);
}
function loadPlayer(p){
  const src=p.id?'track/'+p.id:'album/26rTTXIEtEeSTan28AiLaV';
  const hint=p.id?'':'Busca “'+p.t+'” (pista '+p.n+') en la lista del disco. ';
  $('#player').innerHTML='<iframe title="Reproductor de Spotify" src="https://open.spotify.com/embed/'+src+'?theme=0" width="100%" height="'+(p.id?152:352)+'" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe><div class="hint">'+hint+'<a href="https://open.spotify.com/'+src+'" target="_blank" rel="noopener">Abrir en Spotify ↗</a></div>';
}
function updateProg(){
  $('#prog').textContent=allDone()?'¡Disco completo! Ahora puedes elegir cualquier pista.':done.size+' de '+PISTAS.length+' pistas escuchadas · sigue el orden del 1 al 6';
  if(allDone())cta.classList.add('show');
}
updateProg();refreshLocks();
cta.onclick=()=>$('#fin').classList.add('show');
$('#flame').onclick=function(){
  this.classList.add('off');
  const f=$('#fin');f.classList.add('won');
  $('#finT').textContent='¡Feliz cumpleaños '+NOMBRE+'!';
  $('#finP').innerHTML='<div style="font-size:1.1rem">Eres lo más importante para mí, '+NOMBRE+'. Espero que logres todo lo que te propongas mi niña... Te amodoro.</div><div class="tr"><b>EN</b>You are the most important thing to me. I hope you achieve everything you set your mind to, my girl... I lovdore you.</div><div class="tr"><b>IT</b>Sei la cosa più importante per me. Spero che tu riesca a realizzare tutto ciò che ti prefiggi, bimba mia... Ti amadoro.</div><br>'+FIRMA+'.';
  for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.6,40),i*250);
};

const sc=$('#stars'),sx=sc.getContext('2d');let S=[],mx=0,my=0;
function rs(){sc.width=innerWidth;sc.height=innerHeight;S=Array.from({length:110},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.6+.3,z:Math.random()*.8+.2,p:Math.random()*6}))}
addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)});
(function loop(t){
  sx.clearRect(0,0,sc.width,sc.height);
  S.forEach(s=>{s.y+=.08*s.z;if(s.y>sc.height)s.y=0;
    sx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));
    sx.fillStyle='#bfe3ff';sx.beginPath();sx.arc(s.x-mx*30*s.z,s.y-my*30*s.z,s.r,0,7);sx.fill()});
  requestAnimationFrame(loop)})(0);

const fc=$('#fx'),fx=fc.getContext('2d');let P=[];
function rf(){fc.width=innerWidth;fc.height=innerHeight}addEventListener('resize',rf);rf();
function burst(x,y,n){const c=['#1e6bff','#7ec8ff','#ffffff','#4d8dff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*6+2;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,c:c[i%4],s:Math.random()*4+2})}}
(function fl(){fx.clearRect(0,0,fc.width,fc.height);
  P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.014;fx.globalAlpha=Math.max(p.l,0);fx.fillStyle=p.c;fx.fillRect(p.x,p.y,p.s,p.s)});
  requestAnimationFrame(fl)})();
</script>
</body>
</html>
